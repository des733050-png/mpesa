<!DOCTYPE html>
<html>
<head>
  <title>MPESA Payment</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 50px;
      background: #f5f5f5;
    }
    .box {
      background: white;
      padding: 30px;
      border-radius: 10px;
      display: inline-block;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .number {
      font-size: 28px;
      font-weight: bold;
      color: green;
      margin: 20px 0;
    }
    .btn {
      background: green;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      text-decoration: none;
      display: inline-block;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>MPESA PAYMENT DETAILS</h2>
  <p>Send Money to this number:</p>
  <div class="number">+254114748466</div>
  <p>Use MPESA → Send Money</p>

  <a class="btn" href="tel:+254114748466">Tap to Copy / Call</a>
</div>

</body>
</html>
